# Draws the contribution "snake" in the brand colors and publishes it to the
# `output` branch. The profile README shows it from there.
name: Generate contribution snake

on:
  schedule:
    - cron: "17 3 * * *"   # once a day
  workflow_dispatch:        # run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#F59E0B&color_dots=#1C3558,#0E4A55,#0F766E,#14B8A6,#5EEAD4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
